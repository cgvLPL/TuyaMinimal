<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Home</title>
  <meta name="description" content="Control your Tuya smart home devices.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home">
  <!-- The background runs up behind the clock and battery (the page already leaves room for them). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="/app.js" as="script">
  <link rel="stylesheet" href="/app.css">
  <script>
    try { var bg = localStorage.getItem('bg'); if (bg && bg !== 'system') document.documentElement.setAttribute('data-bg', bg); } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Home needs JavaScript to run.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
